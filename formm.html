<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
             <fieldset align="center"> 
            <legend>User Personal Information</legend>
            <label for="name">Enter your full name:</label>
            <input type="text" id="name" name="name"><br>
            <label for="email">Enter your email:</label>
            <input type="email" id="email" name="email"><br>
            <label for="password">Enter your password:</label>
            <input type="password" id="password" name="password"><br>
            <label for="confirm">Confirm your password:</label>
            <input type="confirm" id="confirm" name="confirm"><br>
             <select >
                <option value="choose an option">Choose an option</option>
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>     
                <option value="option3">Option 3</option>
             </select>
            
            <label> Enter your Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label><br><br>

            <label for="message">Enter your Date of birth:</label>
            <input type="date" id="message" name="message"><br> <br>
            
            <label for="address"></label>Enter your Address:</label>
            <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>
            <input type="submit" value="Submit">

        </fieldset>
    </form>
</body>
</html>
